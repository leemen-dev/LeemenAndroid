#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=6667
APP_VERSION_NAME=12.6.4
APP_PACKAGE=app.leemen.android
IS_PRIVATE=false
# --- Release signing ---
# The values below are DEFAULTS ONLY: the public upstream Telegram debug keystore
# (config/release.keystore, password "android"). They let fresh clones / debug builds
# compile. Production builds are signed with a PRIVATE key that lives OUTSIDE the repo:
#   key file: ~/keystores/leemen-release.jks
#   real path + passwords: ~/.gradle/gradle.properties (gitignored, per-machine override)
# Never put the private key or its real password in this tracked file.
RELEASE_STORE_FILE=../TMessagesProj/config/release.keystore
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx4096M
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true
